<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="Introduce el precio y el % de descuento para obtener el precio final y tu ahorro al instante. Ideal para compras y promociones.">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora de descuentos %</title>
    <link rel="shortcut icon" href="../Favicon/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/descuentos.css">
    <meta name="theme-color" content="#0f1117">
</head>
<body>

    <header>
        <h1>Calculando los descuentos de los precios</h1>
    </header>

    <main class="descuentoPrincipal">

        <section class="grid">
            <label for="price">Precio Original del producto:</label>
             <input type="43.06$" id="price" type="number" placeholder="4.58">

            <label for="coupon">Cupon de descuento:</label>
            <input type="25%" id="coupon" type="text" placeholder="25%">
        </section>

        <button id="calcular" class="calcularDescuento">Calcular Descuento</button>

        <p id="result" class="result">Ingresa los valores para calcular</p>
    </main>
    
   

    <script src="../js/descuentos.js"></script>
</body>
</html>
